name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          
          # Detect active Java major version
          RAW_VERSION=$(java -version 2>&1 | head -n 1)
          echo "Raw version: ${RAW_VERSION}"
          
          JAVA_MAJOR=$(java -version 2>&1 | sed -E -n 's/.*version "([^.-]*).*/\1/p')
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Unable to detect Java major version." >&2
            exit 1
          fi
          
          echo "Detected Java major version: ${JAVA_MAJOR}"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version (${JAVA_MAJOR}) is lower than 17." >&2
            exit 1
          fi
          
          echo "Java environment verified successfully (version >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Keystore Setup ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Keystore ./debug.keystore was not created." >&2
            exit 1
          fi
          echo "Verified ./debug.keystore is present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ -f "$EXPECTED_APK" ]; then
            echo "Found expected debug APK at: ${EXPECTED_APK}"
          else
            echo "ERROR: Expected debug APK not found at: ${EXPECTED_APK}" >&2
            echo "Searching app/build/outputs/apk for available APKs..." >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at ${EXPECTED_APK} is an empty file (0 bytes)." >&2
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: ${EXPECTED_APK} does not have the .apk extension." >&2
              exit 1
              ;;
          esac
          
          echo "Confirmed valid APK file: $(ls -lh "$EXPECTED_APK")"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          VERIFIED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          # Temporary directory on the runner (not committed in repo)
          RELEASE_TEMP_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$RELEASE_TEMP_DIR"
          
          # Sanitize repository name
          REPO_RAW="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_ASSET_PATH="${RELEASE_TEMP_DIR}/${ASSET_NAME}"
          
          cp "$VERIFIED_APK" "$TARGET_ASSET_PATH"
          
          if [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "ERROR: Release asset copy failed or file is empty: ${TARGET_ASSET_PATH}" >&2
            exit 1
          fi
          
          echo "Release asset prepared: ${TARGET_ASSET_PATH}"
          echo "asset_path=${TARGET_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset is missing or empty." >&2
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Asset does not end with .apk." >&2
              exit 1
              ;;
          esac
          
          RELEASE_NOTES="### Automatically Generated Debug APK

- **Build System**: GitHub Actions
- **Run Number**: ${{ github.run_number }}
- **Run Attempt**: ${{ github.run_attempt }}
- **Source Commit**: \`${TARGET_COMMIT}\`
- **Signing**: Signed with temporary debug keystore
- **Intended Use**: For testing purposes only (not a Play Store production release)"
          
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$TARGET_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Reporting APK Download Result ==="
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release published successfully."
            gh release view "$RELEASE_TAG" || true
            
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 📱 Debug APK Build & Release Published

          - **Release Title**: $RELEASE_TITLE
          - **Release Tag**: \`$RELEASE_TAG\`
          - **Direct Release URL**: [$RELEASE_URL]($RELEASE_URL)
          - **APK Asset Filename**: \`$ASSET_NAME\`

          Download the APK directly on your phone from the **Assets** section of the [Release Page]($RELEASE_URL).

          *Note: The Actions workflow artifact \`app-debug-apk\` is also preserved as a backup.*
          EOF
          else
            echo "::warning ::GitHub Release publishing failed or was skipped."
            echo "The debug APK build succeeded and the artifact 'app-debug-apk' remains available."
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## ⚠️ Debug APK Build Ready (Actions Artifact Available)

            The APK was successfully built and uploaded as a GitHub Actions artifact.
            GitHub Release publishing did not complete or was skipped.

            - **Artifact Name**: \`app-debug-apk\`
            - **Expected Path**: \`app/build/outputs/apk/debug/app-debug.apk\`

            You can download the APK from the **Artifacts** section of this GitHub Actions run summary.
            EOF
          fi
